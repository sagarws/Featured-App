# Featured App remote server: relay (control channel) + coturn (video).
# On the VPS:  cd tools/remote-relay/deploy && docker compose up -d
# See README.md here for the firewall ports and the app side.
services:
  relay:
    image: node:24-alpine
    restart: always
    working_dir: /app
    volumes:
      - ../relay.ts:/app/relay.ts:ro
      - ../package.json:/app/package.json:ro
    command: ['node', 'relay.ts', '47900']
    ports:
      - '47900:47900/tcp'

  turn:
    image: coturn/coturn:4.6
    restart: always
    # Host networking: TURN hands out relay ports (49160-49200) on the public IP,
    # which Docker's port mapping cannot do efficiently.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ['-c', '/etc/coturn/turnserver.conf']
