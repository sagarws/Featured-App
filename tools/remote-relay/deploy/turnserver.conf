# coturn for Featured App Remote Desktop video.
# setup-turn.sh fills in the CHANGE-ME values and copies this to /etc/turnserver.conf.
#
# coturn only carries video for sessions where the two networks cannot reach
# each other directly (the apps always try a direct path first), and only
# within the limits below, so a few relayed sessions cannot swamp the VPS.
listening-port=3478
fingerprint

# Short-lived logins handed out by the relay (TURN_SECRET in its environment).
# No TURN password ships inside the apps; a login stops working by itself.
use-auth-secret
static-auth-secret=CHANGE-ME-SECRET
realm=CHANGE-ME-PUBLIC-IP
# The VPS's public IP (needed when the VPS is behind 1:1 NAT, e.g. AWS / GCP / Azure; harmless otherwise):
external-ip=CHANGE-ME-PUBLIC-IP

# ── load limits ──
# Per session, bytes per second, each direction (400 000 B/s ≈ 3.2 Mbit/s;
# the apps cap relayed video at 2.5 Mbit/s).
max-bps=400000
# All relayed sessions together, bytes per second (6 250 000 B/s = 50 Mbit/s,
# about 15 sessions at once). Raise it if the VPS has more bandwidth.
bps-capacity=6250000
# At most this many relay allocations at once (one session uses 1–2).
total-quota=40
user-quota=4
# One UDP port per allocation.
min-port=49160
max-port=49200
# Video is UDP; never open TCP connections to peers on anyone's behalf.
no-tcp-relay

# Only carry traffic between Featured App users, never into private networks behind the server.
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Quiet log: one line per session start/end, not per packet.
simple-log
log-file=stdout
