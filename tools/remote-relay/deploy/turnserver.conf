# coturn for Featured App Remote Desktop video.
# install.sh fills in the CHANGE-ME values; editing by hand works too (copy to /etc/turnserver.conf).
listening-port=3478
fingerprint
lt-cred-mech
# username:password — the same two go into REMOTE_SERVER in shared/constants/remote.ts
user=featured:CHANGE-ME-long-random-password
realm=CHANGE-ME.example.com
# The VPS's public IP (needed when the VPS is behind 1:1 NAT, e.g. AWS / GCP / Azure):
# external-ip=CHANGE-ME-PUBLIC-IP
min-port=49160
max-port=49200
# Only carry traffic between Featured App users, never into private networks behind the server.
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=stdout
