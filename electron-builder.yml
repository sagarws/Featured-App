appId: com.featured.app
productName: Featured App
copyright: Copyright © 2026 Featured App
directories:
  buildResources: build
  output: release/${version}
# ONLY the built app and package.json (plus production node_modules, which
# electron-builder adds itself). Everything else — source, tests, docs, scripts,
# .env, release/ — must never ship.
#
# The win:/mac: sections below have their own `files:` lists. A list with only
# "!" rules counts as "everything except…", which used to override this one and
# pack the whole project (including .env and old installers) into app.asar. So
# every list here starts with the same two includes, and the exclusions below
# are repeated as a safety net.
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!.env*'
  - '!release/**'
  - '!electron/**'
  - '!shared/**'
  - '!tests/**'
  - '!tools/**'
  - '!docs/**'
  - '!scripts/**'
  - '!native/**'
  - '!resources/**'
  - '!build/**'
  - '!*.{ts,mjs,json,md,tsbuildinfo}'
  - 'package.json'
  # Transcripts (transformers.js) in Node use onnxruntime-node only: the web
  # runtime is not loaded, and sharp (images) is replaced by a stand-in in
  # electron/main/transcriber/worker.ts.
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
asar: true
# pdf-to-printer is plain JS that spawns a bundled SumatraPDF.exe, and
# onnxruntime-node ships prebuilt N-API binaries (ABI-stable), so nothing needs
# rebuilding against Electron's ABI.
npmRebuild: false
# Refuses to package without this target's bundled ffmpeg (scripts/check-ffmpeg.cjs).
beforePack: scripts/check-ffmpeg.cjs
# SumatraPDF.exe cannot be executed from inside app.asar. The main process
# points pdf-to-printer at the unpacked copy (see electron/main/print/windows.ts).
# onnxruntime's .node and its shared library must be real files on disk too.
asarUnpack:
  - node_modules/pdf-to-printer/dist/*.exe
  - node_modules/onnxruntime-node/bin/**
# The tray icon is read from disk at runtime, outside the asar.
extraResources:
  - from: build/icon.png
    to: trayIcon.png
  # Recorder: LGPL ffmpeg + ffprobe for this platform/arch, from
  # `npm run ffmpeg` (scripts/fetch-ffmpeg.cjs). Found at <resources>/ffmpeg.
  - from: resources/ffmpeg/${os}-${arch}
    to: ffmpeg
win:
  # Transcripts: only this platform's speech engine binaries.
  files:
    - out/**
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  # Remote Desktop: keyboard/mouse helper (PowerShell + SendInput). Found at <resources>/native.
  extraResources:
    - from: native/win
      to: native
  target:
    - nsis
  artifactName: Featured-App-${arch}-setup.${ext}
nsis:
  # One-click + per-user is what lets the app update itself silently: no wizard,
  # no admin (UAC) prompt, and the installer closes the running app itself.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  # Waits for the old app to let go of its files before replacing them (auto-update).
  include: build/installer.nsh
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Featured App
mac:
  category: public.app-category.business
  # Transcripts: only this platform's speech engine binaries. onnxruntime-node
  # has no Intel (x64) Mac build, so Transcripts shows an error there.
  files:
    - out/**
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v*/{win32,linux}/**'
  # Recorder: checks/asks for the "System Audio Recording" permission, and
  # Remote Desktop: keyboard/mouse helper (remote-input, CoreGraphics events)
  # (scripts/build-native-mac.cjs). Found at <resources>/native.
  extraResources:
    - from: resources/native/mac
      to: native
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: Featured-App-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # A menu-bar agent: no Dock icon until the window is opened.
  extendInfo:
    LSUIElement: true
    # Recorder: shown in the macOS permission prompts.
    NSMicrophoneUsageDescription: Records your voice when you choose the microphone as a recording source.
    NSCameraUsageDescription: Records your webcam and shows the camera bubble on screen recordings.
    NSAudioCaptureUsageDescription: Records the sound your computer plays (meetings, browser, apps) when you choose System audio.
dmg:
  artifactName: Featured-App-${arch}.${ext}
linux:
  # Remote Desktop: keyboard/mouse helper (python3 + X11 XTEST). Found at <resources>/native.
  extraResources:
    - from: native/linux
      to: native
